[package]
name = "og-core"
version = "0.80.2"
edition = "2021"
description = "Event-first, schema-less document database kernel"
license = "MIT"
publish = false
build = false

[lib]
name = "og_core"
path = "src/lib.rs"

[features]
# The default build is a local database node with authentication and the admin CLI.
# Additional service families remain explicit compile-time opt-ins.
default = ["database", "auth", "cli"]

# Internal implementation features. These are not published OG capabilities.
db-engine = []
identity = ["dep:argon2", "dep:chacha20poly1305", "dep:ed25519-dalek"]

# Service capabilities. These control which operation families may be enabled at runtime.
database = ["db-engine"]
auth = ["db-engine", "identity"]
files = ["db-engine"]
events = ["db-engine"]
data-import = []
llm = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:og-llama-common-chat"]
agent = []

# Optional llama.cpp GPU backends. The runtime defaults to OGD_LLM_DEVICE=auto,
# but a CUDA-capable binary still has to be built explicitly.
cuda = ["llm", "llama-cpp-2/cuda", "og-llama-common-chat/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-2/cuda-no-vmm", "og-llama-common-chat/cuda-no-vmm"]
full-cuda = ["full", "cuda"]

# Infrastructure capabilities.
fabric = ["identity", "dep:tungstenite", "dep:sha2"]
files-watch = ["files", "dep:notify"]
cli = ["identity", "dep:rustyline", "dep:rpassword"]
cli-tui = ["cli", "dep:ratatui", "dep:crossterm"]

# Historical/full daemon build plus optional extension providers.
# data-import, llm and agent are compiled but remain disabled by default unless
# OGD_NODE_CAPABILITIES explicitly requests them.
full = [
    "database",
    "auth",
    "files",
    "events",
    "data-import",
    "llm",
    "agent",
    "fabric",
    "files-watch",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_json = "1"
rustyline = { version = "15", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true, features = ["bracketed-paste"] }
ed25519-dalek = { version = "2", optional = true }
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
rpassword = { version = "7", optional = true }
notify = { version = "8", optional = true }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
sha2 = { version = "0.10.9", optional = true }
llama-cpp-2 = { version = "=0.1.156", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
og-llama-common-chat = { path = "llama-common-chat-bridge", optional = true }

[target.'cfg(all(target_pointer_width = "64", target_family = "unix"))'.dependencies]
mmap-guard = "=0.2.2"

[dev-dependencies]
proptest = "1"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "ogd"
path = "src/bin/ogd.rs"

[[bin]]
name = "ogcli"
path = "src/bin/ogcli.rs"
required-features = ["cli"]
