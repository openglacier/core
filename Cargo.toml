[package]
name = "openglacier-core"
version = "2.0.5"
edition = "2021"
description = "An event-first, schema-less document database engine and capability runtime"
repository = "https://github.com/openglacier/core"
homepage = "https://openglacier.org"
keywords = ["database", "document-database", "storage", "query", "events"]
categories = ["database"]
license = "MIT"
publish = true
build = false
# What crates.io receives, and nothing else: the full apps.json (Apps that are not
# public), llm-bench/, notes and scripts stay out wherever cargo publish runs from.
# The library builds in apps_public.json only; apps.json is read by tests alone.
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/apps_public.json",
]

[lints.clippy]
# The groups, then the lints the code still triggers (the only lint configuration of the crate: src/lib.rs keeps the rustc denies).
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
result_large_err = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
multiple_crate_versions = "allow"
chunks_exact_to_as_chunks = "allow"
useless_conversion = "allow"
unnecessary_sort_by = "allow"
manual_is_multiple_of = "allow"
drop_non_drop = "allow"
while_let_loop = "allow"
needless_return = "allow"
unnecessary_lazy_evaluations = "allow"
should_implement_trait = "allow"
misnamed_getters = "allow"
match_single_binding = "allow"

[lib]
name = "og_core"
path = "src/lib.rs"

[features]
# The default build is a local database node with authentication and the admin CLI.
# Additional service families remain explicit compile-time opt-ins (the text of documents in the search: full).
default = ["database", "auth", "cli", "search"]

# Internal implementation features. These are not published OG capabilities.
db-engine = []
identity = ["dep:argon2", "dep:chacha20poly1305", "dep:ed25519-dalek", "dep:sha2"]

# Service capabilities. These control which operation families may be enabled at runtime.
database = ["db-engine"]
auth = ["db-engine", "identity"]
files = ["db-engine"]
events = ["db-engine"]
data-import = []
llm = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:og-llama-common-chat"]
agent = []
# Search through all a Place holds (place.search, src/search/).
search = ["db-engine"]
# The text of PDF, spreadsheets and office documents in the search (src/search/extract.rs).
search-documents = ["search", "dep:lopdf", "dep:calamine", "dep:zip"]
# The native data worker (`ogd data-worker`, src/import/): reads CSV, text and Excel files for data.import without
# Python. When compiled, it is the worker; OG_DATA_WORKER=python asks for the Python one instead.
native-import = ["dep:calamine", "dep:encoding_rs", "dep:unicode-normalization", "dep:sha1"]
# SMTP/SMTPS submission through a remote server (mail.send), routed like any Place provider.
mailsend = ["dep:rustls", "dep:webpki-roots"]

# Optional llama.cpp GPU backends. The runtime defaults to OGD_LLM_DEVICE=auto,
# but a CUDA-capable binary still has to be built explicitly.
cuda = ["llm", "llama-cpp-2/cuda", "og-llama-common-chat/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-2/cuda-no-vmm", "og-llama-common-chat/cuda-no-vmm"]
full-cuda = ["full", "cuda"]

# Infrastructure capabilities.
# The node channels to the Gateway: websockets of our own (src/daemon/websocket.rs), TLS by rustls.
fabric = ["identity", "dep:sha2", "dep:sha1", "dep:rustls", "dep:webpki-roots"]
files-watch = ["files", "dep:notify"]
cli = ["identity"]
# The terminal workspace (src/cli/tui.rs), on the terminal layer of src/cli/term.rs (Unix).
cli-tui = ["cli"]

# Everything a server node can serve, with the native data worker.
# data-import, llm, agent and mailsend are compiled but remain disabled by default unless
# OGD_NODE_CAPABILITIES explicitly requests them.
full = [
    "database",
    "search",
    "search-documents",
    "auth",
    "files",
    "events",
    "data-import",
    "native-import",
    "llm",
    "agent",
    "mailsend",
    "fabric",
    "files-watch",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
zstd = { version = "0.14.3", default-features = false }
lopdf = { version = "0.47", optional = true, default-features = false }
calamine = { version = "0.38", optional = true, default-features = false }
zip = { version = "9.1", optional = true, default-features = false, features = ["deflate"] }
serde_json = "1"
ed25519-dalek = { version = "3", optional = true }
argon2 = { version = "0.6", optional = true }
chacha20poly1305 = { version = "0.11", optional = true }
notify = { version = "8", optional = true }
sha2 = { version = "0.11.1", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
llama-cpp-2 = { version = "=0.1.156", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
unicode-normalization = { version = "0.1.26", optional = true }
sha1 = { version = "0.11", optional = true }
getrandom = "0.4"
og-llama-common-chat = {
    package = "openglacier-llama-common-chat",
    version = "0.1.0",
    optional = true,
}

# mmap(2) of glacier segments, poll(2) for the node channel bridge (fabric), the terminal of ogcli (cli).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "event", "mm", "termios"] }

[dev-dependencies]
proptest = "1"
# Oracle of the import patterns (src/import/pattern.rs).
regex = "1.13"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "ogd"
path = "src/bin/ogd.rs"

[[bin]]
name = "ogcli"
path = "src/bin/ogcli.rs"
required-features = ["cli"]
