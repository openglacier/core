[package]
name = "openglacier-core"
version = "2.0.0"
edition = "2021"
description = "An event-first, schema-less document database engine and capability runtime"
repository = "https://github.com/openglacier/core"
homepage = "https://openglacier.org"
keywords = ["database", "document-database", "storage", "query", "events"]
categories = ["database"]
license = "MIT"
publish = true
build = false
exclude = [
    "antaapalaa*", "release-note*",
    "*.sh", "public-github*", "github-static*"
]

[lints.clippy]
# Lints de documentation trop verbeux
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Lints de performance / API à décider au cas par cas
missing_const_for_fn = "allow"          # breaking change une fois ajouté
result_large_err = "allow"              # nécessite un refactor
too_many_lines = "allow"                # monter la limite via clippy.toml est une alternative

# Lints de cast acceptables dans ce codebase (metrics, codecs, tailles internes)
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# Lints de style trop subjectifs
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
option_option = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

# Lints de dépendances (à traiter séparément via cargo update)
multiple_crate_versions = "allow"

[lib]
name = "og_core"
path = "src/lib.rs"

[features]
# The default build is a local database node with authentication and the admin CLI.
# Additional service families remain explicit compile-time opt-ins.
default = ["database", "auth", "cli", "search", "search-documents"]

# Internal implementation features. These are not published OG capabilities.
db-engine = []
identity = ["dep:argon2", "dep:chacha20poly1305", "dep:ed25519-dalek", "dep:sha2"]

# Service capabilities. These control which operation families may be enabled at runtime.
database = ["db-engine"]
auth = ["db-engine", "identity"]
files = ["db-engine"]
events = ["db-engine"]
data-import = []
llm = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:og-llama-common-chat"]
agent = []
# Search through all a Place holds (place.search, src/search/).
search = ["db-engine"]
# The text of PDF, spreadsheets and office documents in the search (src/search/extract.rs).
search-documents = ["search", "dep:pdf-extract", "dep:calamine", "dep:zip"]
# The native data worker (`ogd data-worker`, src/import/): reads CSV, text and Excel files for data.import without
# Python. When compiled, it is the worker; OG_DATA_WORKER=python asks for the Python one instead.
native-import = ["dep:calamine", "dep:encoding_rs", "dep:regex", "dep:unicode-normalization", "dep:sha1"]
# SMTP/SMTPS submission through a remote server (mail.send), routed like any Place provider.
mailsend = ["dep:rustls", "dep:webpki-roots"]

# Optional llama.cpp GPU backends. The runtime defaults to OGD_LLM_DEVICE=auto,
# but a CUDA-capable binary still has to be built explicitly.
cuda = ["llm", "llama-cpp-2/cuda", "og-llama-common-chat/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-2/cuda-no-vmm", "og-llama-common-chat/cuda-no-vmm"]
full-cuda = ["full", "cuda"]

# Infrastructure capabilities.
fabric = ["identity", "dep:tungstenite", "dep:sha2", "dep:rustix"]
files-watch = ["files", "dep:notify"]
cli = ["identity", "dep:rustyline", "dep:rpassword"]
cli-tui = ["cli", "dep:ratatui", "dep:crossterm"]

# Everything a server node can serve, with the native data worker.
# data-import, llm, agent and mailsend are compiled but remain disabled by default unless
# OGD_NODE_CAPABILITIES explicitly requests them.
full = [
    "database",
    "search",
    "search-documents",
    "auth",
    "files",
    "events",
    "data-import",
    "native-import",
    "llm",
    "agent",
    "mailsend",
    "fabric",
    "files-watch",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
zstd = { version = "0.13", default-features = false }
pdf-extract = { version = "0.12", optional = true }
calamine = { version = "0.37", optional = true, default-features = false }
zip = { version = "9.1", optional = true, default-features = false, features = ["deflate"] }
serde_json = "1"
rustyline = { version = "15", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true, features = ["bracketed-paste"] }
ed25519-dalek = { version = "2", optional = true }
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
rpassword = { version = "7", optional = true }
notify = { version = "8", optional = true }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
sha2 = { version = "0.10.9", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
llama-cpp-2 = { version = "=0.1.156", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
regex = { version = "1.13", optional = true }
unicode-normalization = { version = "0.1.26", optional = true }
sha1 = { version = "0.10", optional = true }
getrandom = "0.4"
og-llama-common-chat = {
    package = "openglacier-llama-common-chat",
    version = "0.1.0",
    optional = true,
}

[target.'cfg(all(target_pointer_width = "64", target_family = "unix"))'.dependencies]
mmap-guard = "=0.2.2"

# poll(2) for the node channel bridge (fabric).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, default-features = false, features = ["std", "event"] }

[dev-dependencies]
proptest = "1"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "ogd"
path = "src/bin/ogd.rs"

[[bin]]
name = "ogcli"
path = "src/bin/ogcli.rs"
required-features = ["cli"]
